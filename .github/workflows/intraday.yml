name: intraday-alerts

on:
  schedule:
    - cron: "*/10 1-5 * * 1-5"   # UTC 01:00–05:50 = 台北 09:00–13:50，每 10 分鐘（GitHub 可能延遲數分鐘）
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 只送 Telegram 測試訊息；force = 忽略盤中時間檢查；空白 = 正常"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check intraday prices and notify
        run: |
          case "${{ github.event.inputs.mode }}" in
            test) python3 scripts/intraday.py --test ;;
            force) python3 scripts/intraday.py --force ;;
            *) python3 scripts/intraday.py ;;
          esac
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit alert log
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/alerts.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "alerts: $(date -u +%FT%H:%M)" && git pull --rebase && git push)
