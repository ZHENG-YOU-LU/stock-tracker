<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>台股自動研究追蹤 v4.0</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #4f46e5; outline-offset: 1px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800" x-data="app()" x-init="init()" x-cloak>

<header class="sticky top-0 z-20 bg-slate-950 text-white shadow-lg" style="padding-top: env(safe-area-inset-top, 0px)">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
    <div>
      <h1 class="text-lg font-bold">台股自動研究追蹤</h1>
      <p class="text-xs text-slate-400" x-text="updatedText"></p>
    </div>
    <button type="button" @click="load()" class="rounded-lg bg-slate-800 px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-700">重新整理</button>
  </div>
  <nav class="mx-auto flex max-w-6xl gap-2 overflow-x-auto px-4 pb-3">
    <template x-for="tb in tabs" :key="tb.id">
      <button type="button" @click="tab = tb.id" class="shrink-0 rounded-lg px-4 py-2 text-sm font-medium"
        :class="tab === tb.id ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" x-text="tb.label"></button>
    </template>
  </nav>
</header>

<main class="mx-auto max-w-6xl space-y-5 px-4 py-6">

  <div x-show="error" class="rounded-xl border border-amber-300 bg-amber-50 p-4 text-sm text-amber-900" role="alert" x-text="error"></div>

  <!-- 總覽 -->
  <section x-show="tab === 'overview' && !error" class="space-y-5">
    <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
      <div class="rounded-xl border bg-white p-4"><p class="text-xs text-slate-500">累計推薦</p><p class="mt-1 text-2xl font-bold" x-text="state.recommendations.length"></p></div>
      <div class="rounded-xl border bg-white p-4"><p class="text-xs text-slate-500">追蹤中</p><p class="mt-1 text-2xl font-bold" x-text="count('追蹤中')"></p></div>
      <div class="rounded-xl border bg-white p-4"><p class="text-xs text-slate-500">勝率（報酬 &gt; 0）</p><p class="mt-1 text-2xl font-bold" x-text="winRate"></p></div>
      <div class="rounded-xl border bg-white p-4"><p class="text-xs text-slate-500">平均報酬</p><p class="mt-1 text-2xl font-bold" :class="cls(avgRet)" x-text="pct(avgRet)"></p></div>
    </div>
    <div class="rounded-xl border bg-white p-5">
      <h2 class="font-bold">狀態分布</h2>
      <div class="mt-3 flex flex-wrap gap-2 text-sm">
        <template x-for="s in statuses" :key="s"><span class="rounded-full bg-slate-100 px-3 py-1"><span x-text="s"></span>：<b x-text="count(s)"></b></span></template>
      </div>
    </div>
    <div class="rounded-xl border bg-white p-5 text-sm text-slate-600">
      <h2 class="font-bold text-slate-800">推薦規則（每個交易日收盤後自動執行）</h2>
      <p class="mt-2">評分達 <b x-text="state.params?.threshold ?? 70"></b> 分才推薦：站上月均價且未過熱、當日溫和上漲、量能放大、成交值前 100 名。停損 −7%、目標 +15%、最長追蹤 <span x-text="state.params?.maxDays ?? 20"></span> 個交易日。</p>
      <p class="mt-2 text-xs text-slate-400">這是量化規則篩選，不是投資建議，也不保證獲利。台股慣例：紅色上漲、綠色下跌。</p>
    </div>
  </section>

  <!-- 最新推薦 -->
  <section x-show="tab === 'today' && !error" class="space-y-4">
    <h2 class="text-xl font-bold" x-text="'最新交易日 ' + (state.lastDate || '—') + ' 的推薦'"></h2>
    <div class="grid gap-4 md:grid-cols-2">
      <template x-for="r in latestRecs" :key="r.id">
        <article class="rounded-2xl border bg-white p-5 shadow-sm">
          <div class="flex items-start justify-between gap-3">
            <h3 class="text-lg font-bold" x-text="r.code + ' ' + r.name"></h3>
            <span class="rounded-lg bg-indigo-50 px-3 py-1 font-bold text-indigo-700" x-text="r.score + '/100'"></span>
          </div>
          <p class="mt-2 text-sm">參考價：<b x-text="money(r.price)"></b></p>
          <p class="mt-1 break-words text-sm">理由：<span x-text="r.reason"></span></p>
          <p class="mt-1 break-words text-sm text-red-600" x-text="r.risk"></p>
        </article>
      </template>
    </div>
    <p x-show="latestRecs.length === 0" class="text-sm text-slate-500">這個交易日沒有符合條件的標的。</p>
  </section>

  <!-- 追蹤與歷史 -->
  <section x-show="tab === 'history' && !error" class="space-y-4">
    <div class="flex flex-wrap items-center gap-2">
      <h2 class="mr-auto text-xl font-bold">推薦歷史與追蹤更新</h2>
      <select x-model="filter" class="rounded-lg border bg-white px-3 py-2 text-sm" aria-label="狀態篩選">
        <option value="">全部狀態</option>
        <template x-for="s in statuses" :key="s"><option :value="s" x-text="s"></option></template>
      </select>
    </div>
    <template x-for="t in filteredTracking" :key="t.id">
      <article class="space-y-3 rounded-2xl border bg-white p-5 shadow-sm">
        <div class="flex flex-wrap items-start justify-between gap-2">
          <div>
            <h3 class="font-bold" x-text="t.code + ' ' + t.name"></h3>
            <p class="text-xs text-slate-500" x-text="'推薦日 ' + t.date + '・已追蹤 ' + t.snapshots.length + ' 個交易日'"></p>
          </div>
          <span class="rounded-full bg-slate-100 px-3 py-1 text-xs" x-text="t.status"></span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm md:grid-cols-5">
          <div><p class="text-xs text-slate-500">參考價</p><p class="font-bold" x-text="money(t.basePrice)"></p></div>
          <div><p class="text-xs text-slate-500">最新價</p><p class="font-bold" x-text="latest(t) == null ? '尚無資料' : money(latest(t))"></p></div>
          <div><p class="text-xs text-slate-500">報酬率</p><p class="font-bold" :class="cls(ret(t))" x-text="pct(ret(t))"></p></div>
          <div><p class="text-xs text-slate-500">停損</p><p class="font-bold" x-text="money(t.stop)"></p></div>
          <div><p class="text-xs text-slate-500">目標</p><p class="font-bold" x-text="money(t.target)"></p></div>
        </div>
        <details x-show="t.snapshots.length">
          <summary class="cursor-pointer text-xs text-indigo-700">查看價格快照</summary>
          <div class="mt-2 overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="text-slate-500"><tr><th class="py-1 pr-4">日期</th><th class="py-1 pr-4">收盤價</th><th class="py-1">報酬率</th></tr></thead>
              <tbody>
                <template x-for="s in [...t.snapshots].reverse()" :key="s.date">
                  <tr class="border-t"><td class="py-1 pr-4" x-text="s.date"></td><td class="py-1 pr-4" x-text="money(s.price)"></td>
                  <td class="py-1" :class="cls(calc(t.basePrice, s.price))" x-text="pct(calc(t.basePrice, s.price))"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </details>
      </article>
    </template>
    <p x-show="filteredTracking.length === 0" class="text-sm text-slate-500">沒有符合的紀錄。</p>
  </section>
</main>

<script>
function app() {
  return {
    tabs: [{ id: 'overview', label: '總覽' }, { id: 'today', label: '最新推薦' }, { id: 'history', label: '追蹤與歷史' }],
    statuses: ['追蹤中', '已達標', '已失效', '已結案'],
    tab: 'overview', filter: '', error: '',
    state: { recommendations: [], tracking: [], lastDate: null, updatedAt: null },

    init() { this.load(); },
    async load() {
      this.error = '';
      try {
        const res = await fetch('data/state.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        d.recommendations ||= []; d.tracking ||= [];
        this.state = d;
      } catch (e) {
        this.error = '讀不到 data/state.json。請透過 GitHub Pages 網址開啟（直接開本機檔案無法讀取），並確認每日排程已至少成功執行一次。';
      }
    },

    get updatedText() { return this.state.updatedAt ? '最後更新 ' + this.state.updatedAt.replace('T', ' ').slice(0, 16) : '尚未更新'; },
    get latestRecs() { return this.state.recommendations.filter(r => r.date === this.state.lastDate); },
    get filteredTracking() {
      return [...this.state.tracking].filter(t => !this.filter || t.status === this.filter).sort((a, b) => b.date.localeCompare(a.date));
    },
    get measured() { return this.state.tracking.filter(t => t.snapshots.length); },
    get avgRet() { const m = this.measured; return m.length ? m.reduce((s, t) => s + this.ret(t), 0) / m.length : null; },
    get winRate() { const m = this.measured; return m.length ? Math.round(m.filter(t => this.ret(t) > 0).length / m.length * 100) + '%' : '—'; },

    count(s) { return this.state.tracking.filter(t => t.status === s).length; },
    latest(t) { return t.snapshots.length ? t.snapshots[t.snapshots.length - 1].price : null; },
    calc(base, p) { return base > 0 && p != null ? (p / base - 1) * 100 : null; },
    ret(t) { return this.calc(t.basePrice, this.latest(t)); },
    money(v) { return v == null ? '—' : 'NT$ ' + Number(v).toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
    pct(v) { return v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%'; },
    cls(v) { return v == null ? 'text-slate-400' : v > 0 ? 'text-red-600' : v < 0 ? 'text-green-600' : 'text-slate-800'; }
  };
}
</script>
</body>
</html>
